name: Angular Reusable CI

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate timestamp tag
        id: tag
        run: |
          echo "TAG=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image-name }}:${TAG} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image-name }}:${TAG} \
          ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image-name }}:latest

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image-name }}:${TAG}
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image-name }}:latest

      - name: Verify Docker images
        run: |
          docker images
